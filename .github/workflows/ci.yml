name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Nom du check à rendre obligatoire dans la protection de main (#4) : « Vérifications ».
  checks:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Cache Turborepo : les tâches dont les fichiers n'ont pas changé ne sont pas relancées.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Les PR sont fusionnées en squash : c'est leur titre qui devient le message du commit.
      - name: Titre de la pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose

      - name: Formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Vérifie que `pnpm bootstrap` monte l'environnement de développement depuis un clone vierge.
  dev-env:
    name: Environnement de dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation en une commande
        run: pnpm bootstrap --no-dev

      - name: Services joignables
        run: |
          docker compose exec -T postgres psql -U epickem -d epickem -c "select 1"
          docker compose exec -T redis redis-cli ping | grep PONG

      - name: Réinitialisation des données
        run: pnpm services:reset

      - name: Arrêt des services
        if: always()
        run: docker compose down --volumes
