name: CI

on:
  pull_request:
    # « edited » relance la CI quand le titre ou la branche cible d'une PR change :
    # le titre est revérifié, et une PR reciblée vers main repasse le contrôle de sa source.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Check obligatoire sur main : seule la branche dev peut y être fusionnée.
  # Les PR vers dev ou une autre branche passent toujours ce contrôle.
  source:
    name: Source de la PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vers main, uniquement depuis dev
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = "main" ] && { [ "$HEAD" != "dev" ] || [ "$HEAD_REPO" != "$REPO" ]; }; then
            echo "::error::Une PR vers main doit venir de la branche dev de ce dépôt (reçu : $HEAD_REPO:$HEAD). Ciblez dev à la place."
            exit 1
          fi
          echo "Source acceptée : $HEAD → $BASE"

  # Check obligatoire sur main et sur dev : « Vérifications ».
  checks:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Cache Turborepo : les tâches dont les fichiers n'ont pas changé ne sont pas relancées.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Les PR sont fusionnées en squash : c'est leur titre qui devient le message du commit.
      - name: Titre de la pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose

      - name: Formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
