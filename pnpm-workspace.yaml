packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true

# Versions partagées : un paquet les référence avec "catalog:".
catalog:
  "@prisma/client": ^6.16.3
  "@types/node": ^24.0.0
  eslint: ^10.15.0
  prisma: ^6.16.3
  turbo: 2.11.11
  # TypeScript 6.0 : typescript-eslint ne supporte pas encore TypeScript 7.
  typescript: ~6.0.3
  vitest: ^5.1.0
